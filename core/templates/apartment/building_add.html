{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}" />
<div class="form-container">
  <h2
    class="form-title"
    style="text-align: center; color: var(--primary); margin-bottom: 25px"
  >
    THÊM TÒA NHÀ <span class="title-icon">🏢</span>
  </h2>
    <!-- prettier-ignore -->
  {% if messages %} {% for message in messages %} 
  {% if message.tags == 'error' %}
  <div class="message-container error-alert" style="margin-bottom: 20px">
    <i class="fa-solid fa-triangle-exclamation"></i> {{ message }}
  </div>
  {% endif %} {% endfor %} {% endif %}

  <form method="post" action="{% url 'building_add' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="name" class="form-label"
        >Tên tòa nhà <span class="required-star">*</span></label
      >
      <input type="text" name="name" id="name" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="max_floor" class="form-label"
        >Số tầng tối đa <span class="required-star">*</span></label
      >
      <input
        type="number"
        name="max_floor"
        id="max_floor"
        class="form-control"
        required
        min="1"
      />
    </div>
    <div class="form-actions" style="margin-top: 30px">
      <button
        type="button"
        class="btn btn-secondary-outline modal-close-btn"
        style="min-width: 150px"
      >
        <i class="fa-solid fa-xmark"></i> Hủy
      </button>
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> Thêm
      </button>
    </div>
  </form>
</div>
