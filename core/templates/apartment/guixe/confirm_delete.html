{% load static %} 
<form method="post" action="{% url 'guixe_delete' guixe.id  %}">
  {% csrf_token %}
  <div class="form-container" style="margin: 0 auto">
    <h2
      class="form-title"
      style="border-bottom: 2px solid #fce8e6; padding-bottom: 10px"
    >
      <i
        class="fa-solid fa-triangle-exclamation"
        style="color: #d93025; font-size: 1.2rem; margin-right: 8px"
      ></i>
      Xác nhận xóa phương tiện gửi xe
    </h2>
    <div style="text-align: center">
      <p style="font-size: 1.1rem; color: #3c4043; margin-bottom: 12px">
        Bạn có chắc chắn muốn xóa phương tiện:<br />
      </p>
      <p style="color: #d93025; font-size: 1rem">
        {{ guixe.get_loai_xe_display }} - {{ guixe.hokhau.id_canho.so_can_ho|default:'' }}
      </p>
      <div
        style="
          background-color: #fef7f7;
          border-radius: 8px;
          padding: 12px 10px;
          margin-top: 12px;
          display: flex;
          align-items: flex-start;
          justify-content: center;
        "
      >
        <i
          class="fa-solid fa-circle-info"
          style="color: #d93025; font-size: 1rem; margin-right: 8px"
        ></i>
        Hành động này không thể hoàn tác và có thể ảnh hưởng đến các dữ liệu
        liên quan.
      </div>
      <div
        style="
          margin-top: 24px;
          display: flex;
          justify-content: center;
          gap: 18px;
        "
      >
        <button
            type="button"
            class="btn btn-secondary-outline"
            id="cancelDeleteBtn"
            style="padding: 10px 22px"
        >
            <i class="fa-solid fa-xmark"></i> Hủy bỏ
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          style="background: #d93025; border-color: #d93025; min-width: 120px"
        >
          Xóa
        </button>
      </div>
    </div>
  </div>
</form>
