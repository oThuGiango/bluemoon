{% load static %} {% load humanize %}
<div class="form-container detail-container">
    <h2 class="modal-title">
      CHI TIẾT KHOẢN THU <i class="fa-solid fa-file"></i>
    </h2>
    <div class="fee-detail-row">
      <span class="fee-label">MÃ KHOẢN THU:</span>
      <span class="fee-value">{{ khoan_thu.id_khoanthu }}</span>
    </div>
    <div class="fee-detail-row">
      <span class="fee-label">TÊN KHOẢN THU:</span>
      <span class="fee-value">{{ khoan_thu.ten_khoanthu }}</span>
    </div>
    <div class="fee-detail-row">
      <span class="fee-label">ĐƠN VỊ TÍNH:</span>
      <span class="fee-value">{{ khoan_thu.get_don_vi_tinh_display }}</span>
    </div>
    <div class="fee-detail-row">
      <span class="fee-label">ĐƠN GIÁ:</span>
      <span class="fee-value price">{{ khoan_thu.don_gia|floatformat:0|intcomma }} VND</span>
    </div>

  <div
    class="income-actions-bottom"
    style="
      margin-top: 30px;
      padding-top: 20px;
      text-align: center;
    "
  >
    <button
      type="button"
      class="btn btn-secondary-outline modal-close-btn"
      style="min-width: 180px"
    >
      <i class="fa-solid fa-xmark"></i> Đóng
    </button>
  </div>
</div>
