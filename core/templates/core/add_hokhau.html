{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm hộ khẩu - BlueMoon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:600,400,700|Roboto:400,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>
  <body>
    {% include 'core/Sidebar.html' %}
    <main>
      {% include 'core/layout_header.html' %}

      <section class="main-content">
        <div class="main-panel" style="max-width: 600px; margin: 0 auto">
          <h2
            class="form-title"
            style="
              text-align: center;
              color: var(--primary);
              margin-bottom: 25px;
            "
          >
            THÊM HỘ KHẨU MỚI <span class="title-icon">🏠</span>
          </h2>

          {% if messages %} {% for message in messages %}
          <div
            class="message-container {{ message.tags }}"
            style="
              margin-bottom: 20px;
              padding: 10px;
              border-radius: 8px;
              border: 1px solid;
            "
          >
            {{ message }}
          </div>
          {% endfor %} {% endif %}

          <form method="POST" action="{% url 'add_hokhau' %}">
            {% csrf_token %}

            <div class="form-group">
              <label for="so_can_ho" class="form-label">
                Số căn hộ <span class="required-star">*</span>
              </label>
              <input
                type="text"
                id="so_can_ho"
                name="so_can_ho"
                placeholder="Ví dụ: A-102"
                required
              />
            </div>

            <div class="form-group">
              <label for="dien_tich" class="form-label"> Diện tích (m²) </label>
              <input
                type="number"
                step="0.01"
                id="dien_tich"
                name="dien_tich"
                placeholder="Nhập diện tích căn hộ..."
              />
            </div>

            <div
              class="form-actions"
              style="
                margin-top: 40px;
                display: flex;
                justify-content: flex-end;
                gap: 15px;
              "
            >
              <a
                href="{% url 'hrmanage' %}"
                class="btn btn-secondary-outline"
                style="text-decoration: none; min-width: 120px"
              >
                <i class="fa-solid fa-xmark"></i> Hủy
              </a>
              <button
                type="submit"
                class="btn btn-primary"
                style="min-width: 150px"
              >
                <i class="fa-solid fa-plus"></i> Tạo hộ khẩu
              </button>
            </div>
          </form>
        </div>
      </section>

      <footer>&copy; BlueMoon Apartment 2026.</footer>
    </main>
  </body>
</html>
