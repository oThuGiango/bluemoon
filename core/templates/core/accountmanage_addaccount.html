{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm tài khoản - BlueMoon</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/Accountant.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fee_management_modal.css' %}" />
  </head>
  <body>
    {% include 'core/Sidebar.html' %}
    <main>
      {% include 'core/layout_header.html' %}
      <section class="main-content">
        <div class="main-panel" style="max-width: 600px; margin: 0 auto">
          <h2
            class="form-title"
            style="
              text-align: center;
              color: var(--primary);
              margin-bottom: 25px;
            "
          >
            TẠO TÀI KHOẢN MỚI <span class="title-icon">👤</span>
          </h2>

          <form method="POST" action="{% url 'accountmanage_addaccount' %}">
            {% csrf_token %}
            <div class="form-group">
              <label class="form-label"
                >Tên đăng nhập <span class="required-star">*</span></label
              >
              <input
                type="text"
                name="username"
                placeholder="Ví dụ: nguyenvan_a"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label"
                >Mật khẩu <span class="required-star">*</span></label
              >
              <input type="password" name="password1" required />
            </div>

            <div class="form-group">
              <label class="form-label"
                >Nhập lại mật khẩu <span class="required-star">*</span></label
              >
              <input type="password" name="password2" required />
            </div>

            <div class="form-group">
              <label class="form-label"
                >Vai trò hệ thống <span class="required-star">*</span></label
              >
              <select
                name="vaitro"
                required
                style="
                  width: 100%;
                  padding: 10px;
                  border-radius: 6px;
                  border: 1px solid #ced4da;
                "
              >
                <option value="">-- Chọn vai trò --</option>
                <option value="admin">Quản trị viên (Admin)</option>
                <option value="ketoan">Kế toán (Accountant)</option>
              </select>
            </div>
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <div class="form-actions" style="margin-top: 30px">
              <a
                href="{% url 'accountmanage' %}"
                class="btn btn-secondary-outline"
                style="text-decoration: none"
              >
                <i class="fa-solid fa-xmark"></i> Hủy
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Tạo tài khoản
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
