{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}" />
<div class="form-container">
  <h2
    class="form-title"
    style="text-align: center; color: var(--primary); margin-bottom: 25px"
  >
    CHỈNH SỬA HỘ KHẨU <span class="title-icon">✏️</span>
  </h2>
  <form method="POST" action="">
    {% csrf_token %} {% for field in form.visible_fields %}
    <div class="form-group">
      <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }} {% if field.field.required %}<span
          class="required-star"
          >*</span
        >{% endif %}
      </label>
      {{ field }} {% if field.errors %}
      <div class="field-error-message">
        {% for error in field.errors %}
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }} {% endfor %}
      </div>
      {% endif %} {% if field.help_text %}
      <small class="form-text text-muted">{{ field.help_text }}</small>
      {% endif %}
    </div>
    {% endfor %}
    <div class="form-actions" style="margin-top: 30px">
      <a
        href="{% url 'hokhau_list' %}"
        class="btn btn-secondary-outline"
        style="min-width: 150px"
      >
        <i class="fa-solid fa-xmark"></i> Hủy
      </a>
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> Cập nhật
      </button>
    </div>
  </form>
</div>
